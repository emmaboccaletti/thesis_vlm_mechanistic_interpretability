name: vlm_gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12.7
  - pip=24.2.0
  - pandas
  - ipykernel
  - numpy
  - scikit-learn
  - scipy
  - libstdcxx-ng
  - libgcc-ng
  - pytorch-cuda=11.8
  - pytorch=2.5.0
  - torchvision=0.20.0
  - torchaudio=2.5.0
  - pillow
  - sentencepiece
  - opencv
  - pip:
      - pytorch-lightning==2.4.0
      - tensorboard==2.17.1
      - tabulate>=0.9.0
      - tqdm>=4.66.5
      - notebook>=7.2.2
      - jupyterlab>=4.2.5
      - matplotlib>=3.9.2
      - seaborn>=0.13.2
      - ipywidgets>=8.1.2
      - huggingface_hub
      - accelerate
      - qwen-vl-utils
      - mistral_inference
      - mistral_common
      - git+https://github.com/huggingface/transformers




